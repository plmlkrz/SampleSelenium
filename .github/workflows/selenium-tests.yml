# DRILL 09 (part 1) — CI/CD WITH GITHUB ACTIONS
#
# "How do you run Selenium tests in CI?" — walk an interviewer through THIS file, top to bottom:
#   trigger -> runner -> checkout -> JDK + dependency cache -> headless test run -> reports.
# Every line below is something you can be asked about.
#
# It runs for real once this repo is pushed to GitHub (Actions tab), including a second
# job that exercises the TestNG parallel suite.

name: Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}   # manual "Run workflow" button — handy for demos and re-runs

jobs:
  # The fast, deterministic gate. No JDK, no browser, no network — so when the Selenium
  # jobs below go red because the-internet.herokuapp.com is down, this one still tells you
  # whether the question bank itself is broken. Interview point: separate the checks that
  # can only fail because of YOUR change from the ones that depend on the outside world.
  question-bank-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax-check practice.js
        run: node --check practice.js

      # Fails on structural errors, duplicate questions, or an answer-length regression
      # past the committed baseline. Ratchets down as batches are rebalanced.
      - name: Audit the question bank
        run: node scripts/audit-question-bank.mjs

  junit-and-cucumber:
    runs-on: ubuntu-latest   # GitHub-hosted runners ship with current Chrome preinstalled
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (with Maven dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven      # caches ~/.m2 keyed on pom.xml — the "why are CI builds fast" answer

      # -B = batch mode (no interactive output). headless=true because CI has no display.
      - name: Run JUnit + Cucumber suites headless
        run: mvn -B test -Dheadless=true

      # if: always() -> reports upload even when tests FAIL — that's the whole point of reports.
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-junit
          path: target/surefire-reports/

      - name: Upload failure screenshots (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-junit
          path: target/screenshots/
          if-no-files-found: ignore

  testng-parallel-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (with Maven dependency cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run the TestNG parallel suite headless
        run: mvn -B test -Pparallel -Dheadless=true

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-testng-parallel
          path: target/surefire-reports/
